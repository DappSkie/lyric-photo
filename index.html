<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lyric Memory</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="player">


    <div class="background"></div>


    <div class="photo-card">

        <img id="photo" src="assets/01.jpg">

    </div>

<div class="gallery">
    <div class="small-photo left"></div>
    <div class="main-photo">
        <img id="photo">
    </div>
    <div class="small-photo right"></div>
</div>

    <div class="lyrics">

        <p id="lyric">
            Klik play
        </p>

    </div>



    <button id="startButton">
        ▶ Play
    </button>



    <audio id="music">

        <source src="assets/music.mp3" type="audio/mpeg">

    </audio>


</div>



<script src="script.js"></script>


</body>

</html>
