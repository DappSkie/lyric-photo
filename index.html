<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric & Photo Sync Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Foto (Layer Utama & Transisi) -->
  <div class="background-container">
    <div id="bg-photo" class="bg-photo"></div>
    <div class="overlay"></div>
  </div>

  <!-- Display Utama -->
  <div class="content-container">
    <div class="lyrics-box">
      <p id="lyric-text">Tekan Play untuk memulai...</p>
    </div>

    <!-- Audio Player Controller -->
    <div class="controls">
      <audio id="audio-player" src="assets/song.mp3" controls></audio>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
